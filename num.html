<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 20px;
            overflow: auto;
        }

        .view-mode {
            width: 100%;
            height: 100%;
            white-space: pre-wrap;
            word-break: break-all;
            color: rgba(255,255,255,0.9);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 16px;
            line-height: 1.8;
            cursor: context-menu;
            overflow: auto;
        }

        .view-mode:empty::before {
            content: '右键点击进行编辑...';
            color: rgba(255,255,255,0.3);
        }

        .edit-mode {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            border: none;
            color: rgba(255,255,255,0.9);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 16px;
            line-height: 1.8;
            resize: none;
            outline: none;
            padding: 0;
        }

        .edit-mode::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="view-mode" id="viewMode"></div>
        <textarea class="edit-mode" id="editMode" placeholder="在此输入内容..."></textarea>
    </div>
    <div class="hint" id="hint">右键点击编辑</div>

    <script>
        const STORAGE_KEY = 'numTextData';
        const viewMode = document.getElementById('viewMode');
        const editMode = document.getElementById('editMode');
        const hint = document.getElementById('hint');

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved || '';
        }

        function saveData(text) {
            localStorage.setItem(STORAGE_KEY, text);
        }

        function renderView() {
            viewMode.textContent = loadData();
            viewMode.style.display = 'block';
            editMode.style.display = 'none';
            hint.style.display = 'block';
        }

        function enterEditMode() {
            editMode.value = loadData();
            editMode.style.display = 'block';
            viewMode.style.display = 'none';
            hint.style.display = 'none';
            editMode.focus();
        }

        function exitEditMode() {
            saveData(editMode.value);
            renderView();
        }

        viewMode.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            enterEditMode();
            return false;
        });

        editMode.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            exitEditMode();
            return false;
        });

        editMode.addEventListener('blur', function() {
            exitEditMode();
        });

        editMode.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                exitEditMode();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderView();
        });
    </script>
</body>
</html>
