<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有日程</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 8px;
            min-height: 100vh;
            overflow-x: auto;
        }
        h1 {
            display: none;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 150px);
            gap: 2px;
        }
        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 150px);
            gap: 2px;
            margin-bottom: 4px;
        }
        .week-day-name {
            text-align: center;
            font-size: 10px;
            color: #666;
            padding: 2px 0;
        }
        .day-cell {
            background-color: #252525;
            padding: 2px 3px;
        }
        .day-date {
            font-size: 10px;
            color: #4a9eff;
            margin-bottom: 2px;
        }
        .day-events {
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .event-tag {
            background-color: #3a5a3a;
            padding: 1px 3px;
            border-radius: 1px;
        }
        .empty-day {
            background-color: #1f1f1f;
            color: #333;
        }
        .empty-day .day-date {
            color: #333;
        }
        .back {
            display: inline-block;
            margin-bottom: 6px;
            color: #4a9eff;
            text-decoration: none;
            font-size: 12px;
        }
        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回主页</a>
    <h1>📅 所有日程</h1>
    
    <div class="week-header">
        <div class="week-day-name">一</div>
        <div class="week-day-name">二</div>
        <div class="week-day-name">三</div>
        <div class="week-day-name">四</div>
        <div class="week-day-name">五</div>
        <div class="week-day-name">六</div>
        <div class="week-day-name">日</div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid"></div>

    <script>
        function formatDate(dateStr) {
            var d = new Date(dateStr);
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function loadAllEvents() {
            var grid = document.getElementById('calendarGrid');
            var stored = localStorage.getItem('calendarEvents');

            if (!stored) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">暂无日程记录</div>';
                return;
            }

            var events = JSON.parse(stored);
            var dateEvents = {};

            for (var i = 0; i < events.length; i++) {
                if (events[i].date) {
                    var date = events[i].date;
                    if (!dateEvents[date]) {
                        dateEvents[date] = [];
                    }
                    dateEvents[date].push(events[i].content);
                } else if (events[i].startDate) {
                    var startDate = new Date(events[i].startDate);
                    var endDate = new Date(events[i].endDate);
                    var current = new Date(startDate);

                    while (current <= endDate) {
                        var date = formatDate(current);
                        if (!dateEvents[date]) {
                            dateEvents[date] = [];
                        }
                        dateEvents[date].push(events[i].content);
                        current.setDate(current.getDate() + 1);
                    }
                }
            }

            if (Object.keys(dateEvents).length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">暂无日程记录</div>';
                return;
            }

            var dates = Object.keys(dateEvents).sort(function(a, b) {
                return new Date(a) - new Date(b);
            });

            var firstDate = new Date(dates[0]);
            var lastDate = new Date(dates[dates.length - 1]);

            var startDate = new Date(firstDate);
            var dayOfWeek = firstDate.getDay();
            var offset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            startDate.setDate(startDate.getDate() + offset);

            var html = '';
            var currentDate = new Date(startDate);

            while (currentDate <= lastDate) {
                var dateStr = formatDate(currentDate);
                var events = dateEvents[dateStr] || [];
                var isEmpty = events.length === 0;

                html += '<div class="day-cell' + (isEmpty ? ' empty-day' : '') + '">';
                html += '<div class="day-date">' + currentDate.getFullYear() + '/' + (currentDate.getMonth() + 1) + '/' + currentDate.getDate() + '</div>';
                html += '<div class="day-events">';
                html += events.map(function(e) { return '<span class="event-tag">' + e + '</span>'; }).join(' ');
                html += '</div></div>';

                currentDate.setDate(currentDate.getDate() + 1);
            }

            grid.innerHTML = html;
        }

        loadAllEvents();
    </script>
</body>
</html>
