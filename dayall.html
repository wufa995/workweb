<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有日程</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 8px;
            min-height: 100vh;
            overflow-x: auto;
        }
        h1 { display: none; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 200px);
            gap: 2px;
        }
        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 200px);
            gap: 2px;
            margin-bottom: 4px;
        }
        .week-day-name {
            text-align: center;
            font-size: 10px;
            color: #ffd700;
            padding: 2px 0;
        }
        .day-cell {
            background-color: #252525;
            padding: 3px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .day-date {
            font-size: 10px;
            color: #4a9eff;
            flex-shrink: 0;
        }
        .day-date.today { color: #ffd700; }
        .day-date.future { color: #ff6b6b; }
        .day-events {
            font-size: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .event-tag {
            background-color: #000000;
            padding: 1px 3px;
            border-radius: 1px;
        }
        .empty-day {
            background-color: #1f1f1f;
            color: #333;
        }
        .empty-day .day-date { color: #333; }
        .back {
            display: inline-block;
            margin-bottom: 6px;
            color: #4a9eff;
            text-decoration: none;
            font-size: 12px;
            padding-right: 15px;
        }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="app">
        <a href="index.html" class="back">← 返回主页</a>
        <a href="#" class="back" @click.prevent="saveCalendarFile">保存文件</a>
        <a v-for="year in years" :key="year" :href="'#'" class="back"
           :style="{ color: currentYear === year ? '#ffd700' : '#4a9eff', marginLeft: year === years[0] ? '15px' : '4px' }"
           @click.prevent="switchYear(year)">{{ year }}</a>
        <h1>全部日记(一整年)</h1>

        <div class="week-header">
            <div class="week-day-name">一</div>
            <div class="week-day-name">二</div>
            <div class="week-day-name">三</div>
            <div class="week-day-name">四</div>
            <div class="week-day-name">五</div>
            <div class="week-day-name">六</div>
            <div class="week-day-name">日</div>
        </div>

        <div class="calendar-grid">
            <div v-for="(day, index) in calendarDays" :key="index"
                 :class="['day-cell', { 'empty-day': day.events.length === 0 }]">
                <div :class="['day-date', { 'today': day.isToday, 'future': day.isFuture }]">
                    {{ day.month }}/{{ day.day }}
                </div>
                <div class="day-events">
                    <span v-for="(event, eIndex) in day.events" :key="eIndex" class="event-tag">
                        {{ event }}
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    currentYear: 2026,
                    years: [2026, 2027, 2028],
                    events: {}
                }
            },
            computed: {
                calendarDays() {
                    const today = new Date()
                    const startDate = new Date(this.currentYear, 0, 1)
                    const dayOfWeek = startDate.getDay()
                    const offset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek
                    startDate.setDate(startDate.getDate() + offset)

                    const days = []
                    const endDate = new Date(this.currentYear, 11, 31)
                    const currentDate = new Date(startDate)

                    while (currentDate <= endDate) {
                        const dateStr = this.formatDate(currentDate)
                        const dayEvents = this.events[dateStr] || []
                        const month = String(currentDate.getMonth() + 1).padStart(2, '0')
                        const day = String(currentDate.getDate()).padStart(2, '0')
                        const isToday = currentDate.toDateString() === today.toDateString()
                        const isFuture = currentDate > today

                        days.push({
                            dateStr,
                            month,
                            day,
                            isToday,
                            isFuture,
                            events: dayEvents
                        })

                        currentDate.setDate(currentDate.getDate() + 1)
                    }

                    return days
                }
            },
            methods: {
                formatDate(date) {
                    const year = date.getFullYear()
                    const month = String(date.getMonth() + 1).padStart(2, '0')
                    const day = String(date.getDate()).padStart(2, '0')
                    return `${year}-${month}-${day}`
                },
                loadAllEvents() {
                    this.events = {}
                    const stored = localStorage.getItem('calendarEvents')
                    
                    if (stored) {
                        const loadedEvents = JSON.parse(stored)
                        for (const event of loadedEvents) {
                            if (event.date) {
                                if (!this.events[event.date]) {
                                    this.events[event.date] = []
                                }
                                this.events[event.date].push(event.content)
                            } else if (event.startDate) {
                                const startDate = new Date(event.startDate)
                                const endDate = new Date(event.endDate)
                                const current = new Date(startDate)

                                while (current <= endDate) {
                                    const date = this.formatDate(current)
                                    if (!this.events[date]) {
                                        this.events[date] = []
                                    }
                                    this.events[date].push(event.content)
                                    current.setDate(current.getDate() + 1)
                                }
                            }
                        }
                    }
                },
                switchYear(year) {
                    this.currentYear = year
                },
                saveCalendarFile() {
                    const dateEvents = {}
                    const stored = localStorage.getItem('calendarEvents')

                    if (stored) {
                        const loadedEvents = JSON.parse(stored)
                        for (const event of loadedEvents) {
                            if (event.date) {
                                if (!dateEvents[event.date]) dateEvents[event.date] = []
                                dateEvents[event.date].push(event.content)
                            } else if (event.startDate) {
                                const start = new Date(event.startDate)
                                const end = new Date(event.endDate)
                                const current = new Date(start)
                                while (current <= end) {
                                    const date = this.formatDate(current)
                                    if (!dateEvents[date]) dateEvents[date] = []
                                    dateEvents[date].push(event.content)
                                    current.setDate(current.getDate() + 1)
                                }
                            }
                        }
                    }

                    const lines = []
                    const sortedDates = Object.keys(dateEvents).sort()

                    for (const dateStr of sortedDates) {
                        if (dateStr.startsWith(this.currentYear + '-')) {
                            const events = dateEvents[dateStr]
                            if (events.length > 0) {
                                const dateParts = dateStr.split('-')
                                const formattedDate = `${dateParts[0]}年${dateParts[1]}月${dateParts[2]}日`
                                lines.push(`${formattedDate}：${events.join('，')}`)
                            }
                        }
                    }

                    const content = lines.join('\n')
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' })
                    const link = document.createElement('a')

                    const today = new Date()
                    const todayStr = `${today.getFullYear()}年${String(today.getMonth() + 1).padStart(2, '0')}月${String(today.getDate()).padStart(2, '0')}日`
                    link.download = `${this.currentYear}一整年的日记（${todayStr}）.txt`

                    const timeStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')} ${String(today.getHours()).padStart(2, '0')}:${String(today.getMinutes()).padStart(2, '0')}:${String(today.getSeconds()).padStart(2, '0')}`
                    localStorage.setItem('lastExportTime', timeStr)

                    link.href = URL.createObjectURL(blob)
                    link.click()
                }
            },
            mounted() {
                this.loadAllEvents()
            },
            watch: {
                currentYear() {
                    this.loadAllEvents()
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
