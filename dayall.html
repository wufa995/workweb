<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有日程</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 8px;
            min-height: 100vh;
            overflow-x: auto;
        }
        h1 {
            display: none;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 200px);
            gap: 2px;
        }
        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 200px);
            gap: 2px;
            margin-bottom: 4px;
        }
        .week-day-name {
            text-align: center;
            font-size: 10px;
            color: #666;
            padding: 2px 0;
        }
        .day-cell {
            background-color: #252525;
            padding: 3px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }
        .border-left {
            border-left: 1px solid #ffd700;
        }
        .border-right {
            border-right: 1px solid #ffd700;
        }
        .border-top {
            border-top: 1px solid #ffd700;
        }
        .border-bottom {
            border-bottom: 1px solid #ffd700;
        }
        .day-date {
            font-size: 10px;
            color: #4a9eff;
            flex-shrink: 0;
        }
        .day-date.today {
            color: #ff4444;
        }

        .day-events {
            font-size: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .event-tag {
            background-color: #3a5a3a;
            padding: 1px 3px;
            border-radius: 1px;
        }
        .empty-day {
            background-color: #1f1f1f;
            color: #333;
        }
        .empty-day .day-date {
            color: #333;
        }
        .back {
            display: inline-block;
            margin-bottom: 6px;
            color: #4a9eff;
            text-decoration: none;
            font-size: 12px;
        }
        .back:hover {
            text-decoration: underline;
        }
    </style>
    
</head>
<body>
    <a href="index.html" class="back">← 返回主页</a>
    <a href="#" class="back" style="margin-left: 15px;" onclick="saveCalendarFile(); return false;">保存文件</a>
    <a href="#" id="year2026" class="back" style="margin-left: 15px; color: #ff4444;" onclick="switchYear(2026); return false;">2026</a>
    <a href="#" id="year2027" class="back" style="margin-left: 4px;" onclick="switchYear(2027); return false;">2027</a>
    <a href="#" id="year2028" class="back" style="margin-left: 4px;" onclick="switchYear(2028); return false;">2028</a>
    <h1>全部日记(一整年)</h1>
    
    <div class="week-header">
        <div class="week-day-name">一</div>
        <div class="week-day-name">二</div>
        <div class="week-day-name">三</div>
        <div class="week-day-name">四</div>
        <div class="week-day-name">五</div>
        <div class="week-day-name">六</div>
        <div class="week-day-name">日</div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid"></div>

    <script>
        var currentYear = 2026;

        function formatDate(dateStr) {
            var d = new Date(dateStr);
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function loadAllEvents(year) {
            var grid = document.getElementById('calendarGrid');
            var stored = localStorage.getItem('calendarEvents');
            var dateEvents = {};

            if (stored) {
                var events = JSON.parse(stored);
                for (var i = 0; i < events.length; i++) {
                    if (events[i].date) {
                        var date = events[i].date;
                        if (!dateEvents[date]) {
                            dateEvents[date] = [];
                        }
                        dateEvents[date].push(events[i].content);
                    } else if (events[i].startDate) {
                        var startDate = new Date(events[i].startDate);
                        var endDate = new Date(events[i].endDate);
                        var current = new Date(startDate);

                        while (current <= endDate) {
                            var date = formatDate(current);
                            if (!dateEvents[date]) {
                                dateEvents[date] = [];
                            }
                            dateEvents[date].push(events[i].content);
                            current.setDate(current.getDate() + 1);
                        }
                    }
                }
            }

            var startDate = new Date(year, 0, 1);
            var dayOfWeek = startDate.getDay();
            var offset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            startDate.setDate(startDate.getDate() + offset);

            var html = '';
            var currentDate = new Date(startDate);
            var endDate = new Date(year, 11, 31);

            var monthStartPositions = [];
            var monthStartBelowPositions = [];
            
            while (currentDate <= endDate) {
                var dateStr = formatDate(currentDate);
                var events = dateEvents[dateStr] || [];
                var isEmpty = events.length === 0;

                var month = String(currentDate.getMonth() + 1).padStart(2, '0');
                var day = String(currentDate.getDate()).padStart(2, '0');
                var today = new Date();
                var isToday = currentDate.toDateString() === today.toDateString();
                
                var cellClass = 'day-cell';
                if (isEmpty) cellClass += ' empty-day';
                
                var isFirstDayOfMonth = currentDate.getDate() === 1;
                var isLastDayOfYear = currentDate.getMonth() === 11 && currentDate.getDate() === 31;
                var dayOfWeek = currentDate.getDay();
                var isSunday = dayOfWeek === 0;
                var isMonday = dayOfWeek === 1;
                
                if (isFirstDayOfMonth) {
                    cellClass += ' border-left border-top';
                    var totalDays = Math.floor((currentDate.getTime() - startDate.getTime()) / (24 * 60 * 60 * 1000));
                    var rowIndex = Math.floor(totalDays / 7);
                    var colIndex = totalDays % 7;
                    monthStartPositions.push({ row: rowIndex, col: colIndex });
                    
                    if (colIndex > 0) {
                        monthStartBelowPositions.push({ row: rowIndex, startCol: 0, endCol: colIndex - 1 });
                    }
                }
                if (isSunday || isLastDayOfYear) {
                    cellClass += ' border-right';
                }
                if (isMonday && !isFirstDayOfMonth) {
                    cellClass += ' border-left';
                }
                
                var daysRemaining = Math.floor((endDate.getTime() - currentDate.getTime()) / (24 * 60 * 60 * 1000));
                if (daysRemaining >= 0 && daysRemaining <= 6) {
                    cellClass += ' border-bottom';
                }
                
                var dateClass = isToday ? 'day-date today' : 'day-date';
                html += '<div class="' + cellClass + '">';
                html += '<div class="' + dateClass + '">' + month + '/' + day + '</div>';
                html += '<div class="day-events">';
                html += events.map(function(e) { return '<span class="event-tag">' + e + '</span>'; }).join(' ');
                html += '</div></div>';

                currentDate.setDate(currentDate.getDate() + 1);
            }

            grid.innerHTML = html;
            
            var cells = grid.querySelectorAll('.day-cell');
            cells.forEach(function(cell, index) {
                var rowIndex = Math.floor(index / 7);
                var colIndex = index % 7;
                
                for (var i = 0; i < monthStartPositions.length; i++) {
                    var pos = monthStartPositions[i];
                    if (rowIndex === pos.row && colIndex >= pos.col) {
                        cell.classList.add('border-top');
                        break;
                    }
                }
                
                for (var i = 0; i < monthStartBelowPositions.length; i++) {
                    var pos = monthStartBelowPositions[i];
                    if (rowIndex === pos.row && colIndex >= pos.startCol && colIndex <= pos.endCol) {
                        cell.classList.add('border-bottom');
                        break;
                    }
                }
            });
        }

        function switchYear(year) {
            currentYear = year;
            document.getElementById('year2026').style.color = year === 2026 ? '#ff4444' : '#4a9eff';
            document.getElementById('year2027').style.color = year === 2027 ? '#ff4444' : '#4a9eff';
            document.getElementById('year2028').style.color = year === 2028 ? '#ff4444' : '#4a9eff';
            loadAllEvents(year);
        }

        loadAllEvents(currentYear);

        function saveCalendarFile() {
            var stored = localStorage.getItem('calendarEvents');
            var dateEvents = {};
            
            if (stored) {
                var events = JSON.parse(stored);
                for (var i = 0; i < events.length; i++) {
                    if (events[i].date) {
                        var date = events[i].date;
                        if (!dateEvents[date]) dateEvents[date] = [];
                        dateEvents[date].push(events[i].content);
                    } else if (events[i].startDate) {
                        var start = new Date(events[i].startDate);
                        var end = new Date(events[i].endDate);
                        var current = new Date(start);
                        while (current <= end) {
                            var date = formatDate(current);
                            if (!dateEvents[date]) dateEvents[date] = [];
                            dateEvents[date].push(events[i].content);
                            current.setDate(current.getDate() + 1);
                        }
                    }
                }
            }
            
            var lines = [];
            var sortedDates = Object.keys(dateEvents).sort();
            
            for (var i = 0; i < sortedDates.length; i++) {
                var dateStr = sortedDates[i];
                if (dateStr.startsWith(currentYear + '-')) {
                    var events = dateEvents[dateStr];
                    if (events.length > 0) {
                        var dateParts = dateStr.split('-');
                        var formattedDate = dateParts[0] + '年' + dateParts[1] + '月' + dateParts[2] + '日';
                        var line = formattedDate + '：' + events.join('，');
                        lines.push(line);
                    }
                }
            }
            
            var content = lines.join('\n');
            var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            var link = document.createElement('a');
            
            var today = new Date();
            var todayStr = today.getFullYear() + '年' + String(today.getMonth() + 1).padStart(2, '0') + '月' + String(today.getDate()).padStart(2, '0') + '日';
            link.download = currentYear + '一整年的日记（' + todayStr + '）.txt';
            
            var timeStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0') + ' ' + String(today.getHours()).padStart(2, '0') + ':' + String(today.getMinutes()).padStart(2, '0') + ':' + String(today.getSeconds()).padStart(2, '0');
            localStorage.setItem('lastExportTime', timeStr);
            
            link.href = URL.createObjectURL(blob);
            link.click();
        }
    </script>
</body>
</html>
