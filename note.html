<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本编辑器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        #app {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .editor-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .view-mode {
            width: 100%;
            height: 100%;
            white-space: pre-wrap;
            word-break: break-all;
            color: rgba(255,255,255,0.9);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            cursor: context-menu;
            overflow-y: auto;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
        }
        .view-mode:empty::before {
            content: '右键点击进行编辑...';
            color: rgba(255,255,255,0.3);
        }
        .edit-mode {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            border: none;
            color: rgba(255,255,255,0.9);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            padding: 10px;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
        }
        .edit-mode::placeholder { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="app">
        <div class="editor-wrapper">
            <div v-if="!isEditing" class="view-mode" @contextmenu.prevent="enterEditMode">
                {{ textData }}
            </div>
            <textarea v-else ref="editTextarea" class="edit-mode" 
                      v-model="textData" 
                      placeholder="在此输入内容..."
                      @contextmenu.prevent="exitEditMode"
                      @blur="exitEditMode"
                      @keydown.esc="exitEditMode">
            </textarea>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, watch, nextTick } = Vue

        createApp({
            data() {
                return {
                    isEditing: false,
                    textData: ''
                }
            },
            methods: {
                loadData() {
                    const saved = localStorage.getItem('numTextData') || localStorage.getItem('noteData')
                    return saved || ''
                },
                saveData(text) {
                    localStorage.setItem('numTextData', text)
                    localStorage.setItem('noteData', text)
                },
                enterEditMode() {
                    this.isEditing = true
                    nextTick(() => {
                        if (this.$refs.editTextarea) {
                            this.$refs.editTextarea.focus()
                            this.resizeTextarea()
                        }
                    })
                },
                exitEditMode() {
                    this.saveData(this.textData)
                    this.isEditing = false
                },
                resizeTextarea() {
                    if (this.$refs.editTextarea) {
                        const textarea = this.$refs.editTextarea
                        const wrapper = textarea.parentElement
                        textarea.style.width = wrapper.clientWidth + 'px'
                        textarea.style.height = wrapper.clientHeight + 'px'
                    }
                },
                handleResize() {
                    if (this.isEditing && this.$refs.editTextarea) {
                        this.resizeTextarea()
                    }
                }
            },
            mounted() {
                this.textData = this.loadData()
                
                window.addEventListener('resize', this.handleResize)
                
                const resizeObserver = new ResizeObserver(() => {
                    this.handleResize()
                })
                
                const wrapper = document.querySelector('.editor-wrapper')
                if (wrapper) {
                    resizeObserver.observe(wrapper)
                }
            },
            beforeUnmount() {
                window.removeEventListener('resize', this.handleResize)
            },
            watch: {
                textData() {
                    this.saveData(this.textData)
                },
                isEditing(val) {
                    if (val) {
                        nextTick(() => {
                            this.resizeTextarea()
                        })
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
